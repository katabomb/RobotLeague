<script>
'use strict';
/* ===== 1 Step2: 有限弾速・相対座標衝突・重量と半径・電力収支 ===== */
const K={VER:4,W:640,H:400,DT:1/30,TMAX:45,SEEDS:[11,23,37],WCAP:Infinity,RCAP:32,BS:300,REACT:1,VR:80,HP:100,TAU:.8,Q0:.15,MAXST:8,KM:.7,KE:.15,EXP:1.3,KS:.2,R0:1,R1:.8,PHI:.5,
EV:[['平原BR',0,[0,1,2]],['障害BR',1,[0,1,2]],['赤対青',0,[0,1]],['青対黄',0,[1,2]],['黄対赤',0,[2,0]]],
CX:320,CY:200,AR:190,SR:150,
OBS:[[320,200,30],...[0,1,2].map(i=>{const a=-Math.PI/6+i*2*Math.PI/3;return[320+100*Math.cos(a),200+100*Math.sin(a),24]})],
SN:['赤','青','黄'],COL:['#d33','#26c','#c90'],MV:['停止','前進','後退','敵へ','敵から','周回'],
SIT:['se','en','ev'],SITN:{se:'敵が射程外',en:'敵が射程内',ev:'敵の弾が接近中'},DN:['動力','装甲','火力','射程','センサー','電源']};
const DEF={n:'はじまりのリーグ',g:1,b:[
{n:'アカツキ',d:[5,3,3,3,5,3],g:1,p:{se:[[1,0,.8,0,0,2],[1,70,.8,0,0,1.5],[1,-40,.8,0,0,2]],en:[[3,0,.6,1,1,1.5],[5,0,.7,1,1,1.5]],ev:[[4,60,1,0,0,1]]}},
{n:'アオバ',d:[2,3,6,5,5,3],g:1,p:{se:[[0,0,0,0,0,.6],[1,60,.5,0,0,1],[1,60,.5,0,0,1]],en:[[0,0,0,1,0,.8],[0,0,0,1,1,.4]],ev:[[4,90,1,0,0,1.2]]}},
{n:'キイロ',d:[8,1,3,2,3,3],g:1,p:{se:[[1,0,1,0,0,2],[1,90,1,0,0,1.2]],en:[[5,0,1,1,1,1.5],[3,0,1,1,1,1]],ev:[[5,0,1,0,0,.8]]}}]};
/* ===== 2 性能導出・検証 ===== */
const der=([s,a,p,r,n,b])=>{const W=15+s+3*a+2*p+2*r+n+2*b+.12*p*r,rad=10*Math.sqrt(W/53),v=230*Math.sqrt(s/W);return{W,rad,p,n,v,tr:v/20,dmg:8+4*p,P:8+4*p,G:3*a,cd:.2,rg:Math.min(380,90+29*r),cap:80+30*b,s,rc:K.R0+K.R1*b}};
const num=(x,lo,hi)=>typeof x==='number'&&isFinite(x)&&x>=lo&&x<=hi;
const chk=b=>{if(!b||typeof b!=='object')return'機体の形式が不正です';if(typeof b.n!=='string'||b.n.length>20)return'機体名は20文字以内の文字列です';
 const d=b.d;if(!Array.isArray(d)||d.length!=6||d.some(x=>!Number.isInteger(x)||x<0||!Number.isSafeInteger(x)))return'設計値は非負の整数6個です';
 if(der(d).rad>K.RCAP)return'機体半径が出場上限を超えています';
 for(const k of K.SIT){const p=b.p&&b.p[k];if(!Array.isArray(p)||p.length>K.MAXST)return K.SITN[k]+'時の行動は'+K.MAXST+'ステップまでです';
  for(const s of p)if(!Array.isArray(s)||s.length!=6||!Number.isInteger(s[0])||s[0]<0||s[0]>5||!num(s[1],-180,180)||!num(s[2],0,1)||![0,1].includes(s[3])||![0,1].includes(s[4])||!num(s[5],.1,5))return K.SITN[k]+'時のステップの値が範囲外です'}return''};
const chkL=l=>{if(!l||l.v!==K.VER)return'対応していない形式バージョンです';if(typeof l.n!=='string'||l.n.length>30||!Number.isInteger(l.g)||l.g<1)return'リーグ情報が不正です';
 if(!Array.isArray(l.b)||l.b.length!=3)return'機体は3機必要です';for(const b of l.b){const e=chk(b);if(e)return e;if(!b.hist||!['wins','streak','best'].every(k=>Number.isSafeInteger(b.hist[k])&&b.hist[k]>=0))return'戦績情報が不正です';if(!Number.isInteger(b.g)||b.g<1||b.g>l.g)return'採用世代が不正です'}return''};
/* ===== 3 戦闘エンジン（DOM非依存・決定論的） ===== */
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const nd=x=>{while(x>Math.PI)x-=2*Math.PI;while(x<-Math.PI)x+=2*Math.PI;return x};
const seg=(x1,y1,x2,y2,o)=>{const dx=x2-x1,dy=y2-y1;let t=((o[0]-x1)*dx+(o[1]-y1)*dy)/(dx*dx+dy*dy||1e-9);t=Math.max(0,Math.min(1,t));return Math.hypot(x1+t*dx-o[0],y1+t*dy-o[1])<o[2]};
function mkMatch(bots,ei,seed,rot){
 const ev=K.EV[ei],R=rng(seed*7+ei),obs=ev[1]?K.OBS:[];
 const U=ev[2].map((id,i)=>{const n=ev[2].length,an=-Math.PI/2+rot*2*Math.PI/3+i*(n==2?Math.PI:2*Math.PI/3),p=[K.CX+K.SR*Math.cos(an),K.CY+K.SR*Math.sin(an),an+Math.PI];return{id,x:p[0],y:p[1],h:p[2],hs:p[2],hp:K.HP,d:der(bots[id].d),cd:0,aim:0,tg:-1,dist:0,hit:-9,sit:'',si:0,st:0,dmg:0,sh:0,ht:0,sn:0,tk:0,en:0,em:0,es:0,ea:0,er:0,ns:0,dead:-1,pd:0,why:'',nh:p[2],vx:0,vy:0}});
 U.forEach(a=>a.e=a.d.cap);
 const m={t:0,obs,u:U,done:false,fx:[],bullets:[],pts:[]};
 const score=()=>{const key=U.map(a=>a.dead<0?[1e9,Math.round((a.dmg+.5*a.hp)*10)]:[a.dead,0]),o=U.map((_,i)=>i).sort((x,y)=>key[y][0]-key[x][0]||key[y][1]-key[x][1]),base=U.length==3?[2,1,0]:[2,0],eq=(x,y)=>key[x][0]==key[y][0]&&key[x][1]==key[y][1];
  for(let i=0,j;i<o.length;i=j+1){j=i;while(j+1<o.length&&eq(o[j+1],o[i]))j++;let s=0;for(let k=i;k<=j;k++)s+=base[k];for(let k=i;k<=j;k++)m.pts[o[k]]=s/(j-i+1)}};
 m.step=()=>{if(m.done)return;const dt=K.DT;m.t+=dt;const A=U.filter(a=>a.dead<0);
  for(const a of A){a.tk++;let best=-1,bd=1e9;
   U.forEach((b,j)=>{if(b===a||b.dead>=0)return;const dd=Math.hypot(b.x-a.x,b.y-a.y);if(dd<bd){bd=dd;best=j}});
   if(best!==a.tg){a.tg=best;a.aim=0}a.dist=bd}
  for(const a of A){a.pvx=a.vx;a.pvy=a.vy}
  for(const a of A){const d=a.d,b=a.tg>=0?U[a.tg]:null,sit=m.bullets.some(q=>{if(q.owner===a.id)return false;const x=q.x-a.x,y=q.y-a.y,vx=q.vx-a.pvx,vy=q.vy-a.pvy,t=-(x*vx+y*vy)/(vx*vx+vy*vy||1);return t>0&&t<Math.min(K.REACT,q.left/K.BS)&&Math.hypot(x+vx*t,y+vy*t)<a.d.rad+5})?'ev':(b&&a.dist<=d.rg?'en':'se');
   if(sit!==a.sit){a.sit=sit;a.si=0;a.st=0;a.hs=a.h;a.bounce=null}
   const P=bots[a.id].p[sit],s=P.length?P[a.si%P.length]:[0,0,0,0,0,1];a.why=K.SITN[sit]+' 手順'+(a.si+1)+(b?' 目標'+K.SN[b.id]:'');
   a.st+=dt;if(a.st>=s[5]){a.si=(a.si+1)%Math.max(1,P.length);a.st=0;a.hs=a.h;a.bounce=null}
   const mv=s[0],g=s[1]*Math.PI/180,br=b?Math.atan2(b.y-a.y,b.x-a.x):a.hs;
   const dir=a.bounce??[a.h,a.hs+g,a.h+Math.PI,br+g,br+Math.PI+g,br+Math.PI/2+g][mv];let h=a.h;
   if(mv!=0&&mv!=2){const tn=d.tr*dt;h+=Math.max(-tn,Math.min(tn,nd(dir-a.h)))}
   let f=mv==0?0:s[2]*(mv==2?.6:Math.max(0,Math.cos(nd(dir-h))));const aim=!!(s[3]&&b),rg=d.rc*dt,available=Math.min(d.cap,a.e+rg),gain=available-a.e,ac=Math.min(available,aim?K.KS*d.n*dt:0),budget=Math.min(available-ac,Math.max(K.PHI*rg,a.e+K.PHI*rg-ac));
   if(d.s>0)f=Math.min(f,Math.sqrt(Math.max(0,budget)/(dt*K.KM*d.s)));const v=d.v*f,tr=a.bounce!=null?dir:mv==2?dir:h;a.nh=h;a.vx=Math.cos(tr)*v;a.vy=Math.sin(tr)*v;a.aim=aim?a.aim+dt:0;
   const mc=dt*K.KM*d.s*f*f;a.e=Math.max(0,available-ac-mc);a.er+=gain;a.em+=mc;a.ea+=ac;a.en+=mc+ac;
   a.cd-=dt;if(b&&a.dist<=d.rg)a.sn++;
   if(s[4]&&b&&a.cd<=0&&a.dist<=d.rg){const cost=K.KE*Math.pow(d.P,K.EXP);if(a.e<cost)a.ns++;else{
    const noise=()=> (R()+R()+R()+R()-2)*Math.sqrt(3),vx=b.pvx+noise()*35/(1+d.n),vy=b.pvy+noise()*35/(1+d.n);let t=a.dist/K.BS;for(let i=0;i<5;i++)t=Math.hypot(b.x-a.x+vx*t,b.y-a.y+vy*t)/K.BS;
    const x=b.x-a.x+vx*t,y=b.y-a.y+vy*t;if(Math.hypot(x,y)<=d.rg){const ang=Math.atan2(y,x)+noise()*.5/(1+d.n)*(.4+.6*Math.exp(-a.aim/.8))*(1+2*v/K.VR);a.cd=d.cd;a.e-=cost;a.en+=cost;a.es+=cost;a.sh++;a.aim=0;m.bullets.push({x:a.x,y:a.y,vx:K.BS*Math.cos(ang),vy:K.BS*Math.sin(ang),left:d.rg,owner:a.id,P:d.P})}}}}
  for(const a of A){a.ox=a.x;a.oy=a.y;a.h=a.nh;a.x+=a.vx*dt;a.y+=a.vy*dt}
  const reflect=(a,nx,ny)=>{const dot=a.vx*nx+a.vy*ny;if(dot<=0)return;const x=a.vx-2*dot*nx,y=a.vy-2*dot*ny;a.bounce=Math.atan2(y,x);a.h=a.bounce;a.vx=x;a.vy=y};
  const constrain=a=>{for(const o of obs){const dx=a.x-o[0],dy=a.y-o[1],l=Math.hypot(dx,dy),r=o[2]+a.d.rad;if(l<r){if(l)reflect(a,-dx/l,-dy/l);a.x=o[0]+(l?dx/l:1)*r;a.y=o[1]+(l?dy/l:0)*r}}const dx=a.x-K.CX,dy=a.y-K.CY,l=Math.hypot(dx,dy),q=K.AR-a.d.rad;if(l>q){reflect(a,dx/l,dy/l);a.x=K.CX+dx/l*q;a.y=K.CY+dy/l*q}};
  for(let i=0;i<4;i++){A.forEach(constrain);for(let j=0;j<A.length;j++)for(let k=j+1;k<A.length;k++){const a=A[j],b=A[k],dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy),over=a.d.rad+b.d.rad-l;if(over>0){const x=l?dx/l:1,y=l?dy/l:0,f=b.d.W/(a.d.W+b.d.W);a.x-=x*over*f;a.y-=y*over*f;b.x+=x*over*(1-f);b.y+=y*over*(1-f)}}}A.forEach(constrain);for(const a of A){a.vx=(a.x-a.ox)/dt;a.vy=(a.y-a.oy)/dt}
  m.bullets=m.bullets.filter(q=>{const f=Math.min(1,q.left/(K.BS*dt)),x=q.x+q.vx*dt*f,y=q.y+q.vy*dt*f;let hit=null,first=2;for(const a of A){if(a.id===q.owner)continue;const sx=q.x-a.ox,sy=q.y-a.oy,dx=x-q.x-(a.x-a.ox)*f,dy=y-q.y-(a.y-a.oy)*f,aa=dx*dx+dy*dy,bb=sx*dx+sy*dy,cc=sx*sx+sy*sy-a.d.rad*a.d.rad,disc=bb*bb-aa*cc,t=cc<=0?0:aa>0&&disc>=0?(-bb-Math.sqrt(disc))/aa:2;if(t>=0&&t<=1&&t<first){first=t;hit=a}}if(hit){const owner=U.find(a=>a.id===q.owner),dm=q.P*q.P/(q.P+hit.d.G);hit.pd+=dm;owner.dmg+=dm;owner.ht++;m.fx.push([q.x+(x-q.x)*first,q.y+(y-q.y)*first,m.t]);return false}q.x=x;q.y=y;q.left-=K.BS*dt*f;return q.left>1e-8});m.fx=m.fx.filter(f=>m.t-f[2]<.2);
  for(const a of A){if(a.pd>0)a.hit=m.t;a.hp-=a.pd;a.pd=0;if(a.hp<=0){a.hp=0;a.dead=m.t}}
  if(U.filter(a=>a.dead<0).length<=1||m.t>=K.TMAX){m.done=true;score()}};
 return m}

const prepare=()=>{if($('mode').value==='trial'&&chk(pr)){showErr(chk(pr));return false}watchBots=clone($('mode').value==='trial'?cur():L.b);return true};
$('all').onclick=()=>{resetWatch();if(!prepare())return;queue=order().map((_,i)=>i);start(queue.shift())};
$('matches').onclick=e=>{if(e.target.dataset.j==null)return;const j=+e.target.dataset.j;resetWatch();if(prepare()){queue=[j+1,j+2];start(j)}};
$('again').onclick=()=>{if(current!=null){clearTimeout(timer);queue=[];start(current)}};
$('mode').onchange=resetWatch;
$('pz').onclick=()=>{if(!mt)return;if(mt.done){clearTimeout(timer);if(queue.length){pz=!pz;if(!pz)start(queue.shift())}return}pz=!pz;if(!pz){last=performance.now();raf=requestAnimationFrame(loop)}else cancelAnimationFrame(raf)};
$('ex').onclick=()=>{$('js').value=JSON.stringify({v:K.VER,type:'robot',...pr})};
$('im').onclick=()=>{try{const o=JSON.parse($('js').value),e=o.v!==K.VER?'対応していない機体バージョンです':chk(o);if(e){$('jm').innerHTML='<span class=ng>'+esc(e)+'</span>';return}pr={n:o.n,d:o.d,p:o.p,g:L.b[ti].g};$('jm').textContent='読み込みました（世代は進みません）';inv();des();pat();preview()}catch(x){$('jm').innerHTML='<span class=ng>JSONとして読めません</span>'}};
const botArt=(b,i)=>`<svg viewBox="0 0 100 80"><circle cx="50" cy="40" r="36" fill="none" stroke="${K.COL[i]}" stroke-dasharray="3 4"/><circle cx="50" cy="40" r="${Math.min(34,der(b.d).rad*1.1)}" fill="${K.COL[i]}" fill-opacity=".25" stroke="${K.COL[i]}" stroke-width="2"/><path d="M50 40 V8" stroke="${K.COL[i]}" stroke-width="3"/></svg>`;
 const preview=()=>{$('preview').innerHTML=botArt(pr,ti)+`<p>機体半径 ${der(pr.d).rad.toFixed(1)} / ${K.RCAP}</p><small>設計プレビュー</small>`};
 function setPhase(x){phase=x;document.body.classList.toggle('work',x==='workshop');$('intro').hidden=x!=='spectate';$('arena').hidden=!['spectate','challenge'].includes(x);$('workshop').hidden=x!=='workshop';$('handover').hidden=true;$('result').hidden=x!=='result';$('heading').textContent=({spectate:preseason?'リーグ創設前最終戦':'大会観戦',workshop:'機体開発工房',challenge:'新大会への挑戦',result:'大会結果'})[x];$('arenaLabel').textContent=x==='challenge'?'LIVE / CHALLENGE':'ARCHIVE / SPECTATE';$('mode').value=x==='spectate'?'official':'trial';$('records').open=x==='workshop';matchList();}
 function showHandover(){$('newName').value=L.b[ti].n;validateHandover();$('handover').hidden=false;$('records').open=true;$('handoBot').innerHTML=ties.map(i=>`<div class=bot>${botArt(L.b[i],i)}<b>${esc(L.b[i].n)}</b> ${ties.length>1?`<label><input type=radio name=pick value=${i} ${i===ti?'checked':''}>選択</label>`:''}</div>`).join('');}
 $('skip').onclick=()=>{resetWatch();if(phase==='spectate')showHandover();else if(published){setPhase('result')}else $('test').click()};
 $('take').onclick=()=>{const pick=document.querySelector('input[name=pick]:checked');if(pick)ti=+pick.value;const name=$('newName').value.trim();if(nameErr(name)){$('nameError').textContent=nameErr(name);$('newName').focus();return}pr=clone(L.b[ti]);pr.n=name;inv();setPhase('workshop');des();pat();preview();$('opponents').innerHTML=L.b.map((b,i)=>`<details><summary>${esc(b.n)} の設計</summary><p>${K.DN.map((n,j)=>n+' '+b.d[j]).join(' ／ ')}</p>${K.SIT.map(k=>`<p>${K.SITN[k]}：${b.p[k].map(s=>K.MV[s[0]]+' '+s[1]+'° '+s[2]*100+'% '+(s[3]?'照準 ':'')+(s[4]?'射撃 ':'')+s[5]+'秒').join(' → ')}</p>`).join('')}</details>`).join('');window.scrollTo(0,0)};
 function validateHandover(){const e=nameErr($('newName').value);$('nameError').textContent=e;$('take').disabled=!!e} $('newName').oninput=validateHandover; $('handoBot').onchange=e=>{if(e.target.name==='pick'){ti=+e.target.value;$('newName').value=L.b[ti].n;validateHandover()}};
 $('enter').onclick=()=>{const e=chk(pr)||nameErr(pr.n);if(e){alert(e);return}setPhase('challenge');$('all').click();window.scrollTo(0,0)};
 $('replay').onclick=()=>{setPhase('challenge');$('all').click();window.scrollTo(0,0)}; $('back').onclick=()=>{resetWatch();setPhase('workshop');window.scrollTo(0,0)};
 $('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('out').value)}catch(e){$('out').select();document.execCommand('copy')}};
 const shareText=(short=false)=>{if(!published)return '';const n=published, ranks=rk(P.tot),own=n.b[ti],w=n.b.filter((_,i)=>ranks[i]===1),win=w[0];let story=ranks[ti]===1?(w.length===1?`🏆 ${own.n}が新チャンピオンに！`:`${own.n}が${w.filter(x=>x!==own).map(x=>x.n).join('・')}と同率首位！`):`⚙️ ${own.n}が最下位から${ranks[ti]}位に浮上！\n🏆 ${w.length===1?win.n+'（連続優勝'+win.hist.streak+'回）':w.map(x=>x.n).join('・')+'が同率首位'}`;const tag=x=>x.replace(/[^\p{L}\p{N}_]/gu,'');return `【ロボットリーグ】\n${n.n} 第${n.g}世代誕生！\n${story}\n${short?'機体を改良して次の大会に挑戦！':'ロボットを設計・改良し，大会に挑戦するゲームです．\n'+n.b.map((x,i)=>ranks[i]+'位 '+x.n+' '+P.tot[i].toFixed(2)+'点').join('\n')}\n#ロボットリーグ #${tag(n.n)} #${tag(own.n)}`};
$('mail').onclick=()=>{location.href='mailto:?subject='+encodeURIComponent('ロボットリーグ｜'+published.n+' 第'+published.g+'世代')+'&body='+encodeURIComponent(shareText()+'\n'+$('out').value)};
$('xshare').onclick=()=>window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(shareText(true))+'&url='+encodeURIComponent($('out').value),'_blank','noopener');
$('copyPost').onclick=async()=>{try{await navigator.clipboard.writeText(shareText(true)+'\n'+$('out').value);$('shareStatus').textContent='投稿文をコピーしました．'}catch(e){$('shareStatus').textContent='コピーできませんでした．URLコピーをお試しください．'}};
$('other').onclick=async()=>{try{if(navigator.share)await navigator.share({title:'ロボットリーグ',text:shareText(true),url:$('out').value});else $('copyPost').click()}catch(e){if(e.name!=='AbortError')$('shareStatus').textContent='共有できませんでした．投稿文コピーをお試しください．'}};
$('next').onclick=()=>{location.href=$('out').value;location.reload()};
 let l0=DEF;const h=location.hash;if(h.startsWith('#L=')){try{const l=dec(h.slice(3)),e=chkL(l);if(e)notice='<span class=ng>URLを読み込めませんでした: '+esc(e)+'（標準リーグで開始）</span>';else {l0=l;preseason=false}}catch(x){notice='<span class=ng>URLを解読できません（標準リーグで開始）</span>'}}
l0=clone(l0);l0.v=K.VER;init(l0);setPhase('spectate');$('cards').innerHTML=L.b.map((b,i)=>`<div class=bot>${botArt(b,i)}<h3>${esc(b.n)}</h3><small>${preseason?'創設前選抜機':'累積優勝 '+b.hist.wins+'回 ／ 連続 '+b.hist.streak+'回'}</small></div>`).join('');$('opponents').innerHTML=L.b.map((b,i)=>`<details><summary>${esc(b.n)} の設計</summary><p>${K.DN.map((n,j)=>n+' '+b.d[j]).join(' ／ ')}</p>${K.SIT.map(k=>`<p>${K.SITN[k]}：${b.p[k].map(s=>K.MV[s[0]]+' '+s[1]+'° '+s[2]*100+'% '+(s[3]?'照準 ':'')+(s[4]?'射撃 ':'')+s[5]+'秒').join(' → ')}</p>`).join('')}</details>`).join('');$('story').textContent=preseason?'選抜を勝ち抜いた3機．この戦いを見届け，新しいリーグの創設に挑もう．':'前大会の戦いを振り返り，次の挑戦に備えよう．';}
</script></html>
